<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To Do</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
      color: #1a1a1a;
    }

    .app {
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      background: #fff;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus { border-color: #6366f1; }

    button.add-btn {
      padding: 12px 20px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    button.add-btn:hover { background: #4f46e5; }

    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .filter-btn {
      padding: 6px 14px;
      border: 1.5px solid #ddd;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      background: #fff;
      cursor: pointer;
      transition: all 0.12s;
      color: #555;
    }

    .filter-btn.active {
      background: #6366f1;
      border-color: #6366f1;
      color: #fff;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1.5px solid #eee;
      transition: opacity 0.15s;
    }

    .item.done { opacity: 0.5; }

    .item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #6366f1;
      cursor: pointer;
      flex-shrink: 0;
    }

    .item-text {
      flex: 1;
      font-size: 15px;
      word-break: break-word;
    }

    .item.done .item-text {
      text-decoration: line-through;
      color: #999;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #bbb;
      font-size: 18px;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.12s;
      flex-shrink: 0;
    }

    .delete-btn:hover { color: #ef4444; }

    .footer {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #999;
    }

    .clear-btn {
      background: none;
      border: none;
      font-size: 13px;
      color: #999;
      cursor: pointer;
      padding: 0;
      transition: color 0.12s;
    }

    .clear-btn:hover { color: #ef4444; }

    .empty {
      text-align: center;
      color: #bbb;
      font-size: 14px;
      padding: 32px 0;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>To Do</h1>

    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add a task…" />
      <button class="add-btn" onclick="addTask()">Add</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
      <button class="filter-btn" data-filter="active" onclick="setFilter('active')">Active</button>
      <button class="filter-btn" data-filter="done" onclick="setFilter('done')">Done</button>
    </div>

    <div class="list" id="list"></div>

    <div class="footer" id="footer"></div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
    let filter = 'all';

    function save() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      if (!text) return;
      tasks.unshift({ id: Date.now(), text, done: false });
      input.value = '';
      save();
      render();
    }

    function toggleTask(id) {
      const t = tasks.find(t => t.id === id);
      if (t) t.done = !t.done;
      save();
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      save();
      render();
    }

    function clearDone() {
      tasks = tasks.filter(t => !t.done);
      save();
      render();
    }

    function setFilter(f) {
      filter = f;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === f);
      });
      render();
    }

    function render() {
      const visible = tasks.filter(t =>
        filter === 'all' ? true : filter === 'done' ? t.done : !t.done
      );

      const list = document.getElementById('list');
      if (visible.length === 0) {
        list.innerHTML = '<div class="empty">No tasks here.</div>';
      } else {
        list.innerHTML = visible.map(t => `
          <div class="item ${t.done ? 'done' : ''}">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})" />
            <span class="item-text">${escHtml(t.text)}</span>
            <button class="delete-btn" onclick="deleteTask(${t.id})" title="Delete">×</button>
          </div>
        `).join('');
      }

      const active = tasks.filter(t => !t.done).length;
      const done = tasks.filter(t => t.done).length;
      const footer = document.getElementById('footer');
      footer.innerHTML = tasks.length ? `
        <span>${active} left</span>
        ${done ? `<button class="clear-btn" onclick="clearDone()">Clear done (${done})</button>` : ''}
      ` : '';
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.getElementById('taskInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });

    render();
  </script>
</body>
</html>
